<svg width="420" height="170" viewBox="0 0 420 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wai Yan GitHub stats</title>
  <desc id="desc">Static GitHub profile stats for CharmTzy.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="420" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="accent" x1="26" y1="28" x2="394" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="420" height="170" rx="18" fill="url(#card)" filter="url(#shadow)"/>
  <rect x="1" y="1" width="418" height="168" rx="17" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="350" cy="28" r="76" fill="#38BDF8" opacity="0.06"/>
  <circle cx="48" cy="150" r="58" fill="#22C55E" opacity="0.07"/>

  <text x="28" y="40" fill="#38BDF8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">GitHub Snapshot</text>
  <text x="28" y="64" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">CharmTzy · public profile</text>

  <g transform="translate(28 88)">
    <rect width="108" height="54" rx="14" fill="#020617" opacity="0.55"/>
    <text x="14" y="23" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">14</text>
    <text x="14" y="41" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">public repos</text>
  </g>

  <g transform="translate(156 88)">
    <rect width="108" height="54" rx="14" fill="#020617" opacity="0.55"/>
    <text x="14" y="23" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">8</text>
    <text x="14" y="41" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">languages</text>
  </g>

  <g transform="translate(284 88)">
    <rect width="108" height="54" rx="14" fill="#020617" opacity="0.55"/>
    <text x="14" y="23" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">2021</text>
    <text x="14" y="41" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">on GitHub</text>
  </g>
</svg>
