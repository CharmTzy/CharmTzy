<svg width="420" height="170" viewBox="0 0 420 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wai Yan top public languages</title>
  <desc id="desc">Static top language snapshot for CharmTzy public repositories.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="420" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#052E2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="26" y1="28" x2="394" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="420" height="170" rx="18" fill="url(#card)" filter="url(#shadow)"/>
  <rect x="1" y="1" width="418" height="168" rx="17" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="355" cy="136" r="72" fill="#22C55E" opacity="0.07"/>
  <circle cx="52" cy="24" r="54" fill="#38BDF8" opacity="0.07"/>

  <text x="28" y="40" fill="#38BDF8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Top Public Languages</text>
  <text x="28" y="64" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Based on current public repositories</text>

  <g transform="translate(28 84)">
    <text x="0" y="11" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTML</text>
    <rect x="96" y="1" width="250" height="12" rx="6" fill="#020617" opacity="0.65"/>
    <rect x="96" y="1" width="250" height="12" rx="6" fill="#E34F26"/>
    <text x="360" y="12" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">3</text>
  </g>

  <g transform="translate(28 106)">
    <text x="0" y="11" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Java</text>
    <rect x="96" y="1" width="250" height="12" rx="6" fill="#020617" opacity="0.65"/>
    <rect x="96" y="1" width="250" height="12" rx="6" fill="#ED8B00"/>
    <text x="360" y="12" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">3</text>
  </g>

  <g transform="translate(28 128)">
    <text x="0" y="11" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Python</text>
    <rect x="96" y="1" width="250" height="12" rx="6" fill="#020617" opacity="0.65"/>
    <rect x="96" y="1" width="84" height="12" rx="6" fill="#3776AB"/>
    <text x="360" y="12" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">1</text>
  </g>

  <g transform="translate(28 150)">
    <text x="0" y="11" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">TypeScript</text>
    <rect x="96" y="1" width="250" height="12" rx="6" fill="#020617" opacity="0.65"/>
    <rect x="96" y="1" width="84" height="12" rx="6" fill="#3178C6"/>
    <text x="360" y="12" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">1</text>
  </g>
</svg>
